# Évaluation de bout en bout avec seuils bloquants, sur le jeu de DEV uniquement (D003) :
# le jeu de test n'est jamais utilisé en CI, pour qu'une CI rouge ne pousse pas à régler le
# système sur lui. Appelle des LLM payants (~0,09 $ par exécution, mesuré) : déclenchée sur pull
# request et à la demande, pas à chaque push.
name: Évaluation (seuils bloquants)

on:
  pull_request:
  workflow_dispatch:

# Une seule évaluation à la fois par branche : un nouveau push annule la précédente.
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secret GitHub (Settings > Secrets and variables > Actions), jamais dans le code.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-multilingual-e5-small

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Construire l'index (ignoré par git, reconstruit à chaque exécution)
        run: uv run python -m rag.ingestion

      - name: Évaluer sur le dev et vérifier les seuils
        run: uv run python scripts/eval_e2e.py --split dev --run-name ci-${{ github.run_number }} --check

      # Détail par question (réponses, verdicts du juge) pour comprendre un échec.
      - name: Conserver les résultats MLflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-eval-${{ github.run_number }}
          path: |
            mlflow.db
            mlruns/
