# Tests à chaque push : validation des données et tests unitaires.
# Aucun appel à un LLM (faux LLM dans les tests) : gratuit et rapide.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Le modèle d'embeddings (~470 Mo) est téléchargé une fois puis gardé en cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-multilingual-e5-small

      - name: Installer les dépendances (versions exactes de uv.lock)
        run: uv sync --locked

      - name: Valider le jeu de données
        run: uv run python scripts/validate.py

      - name: Tests unitaires
        run: uv run pytest -q
